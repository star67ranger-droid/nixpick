name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Git identity for tests
        run: |
          git config --global user.email "nixpick-ci@localhost"
          git config --global user.name "nixpick-ci"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - run: nix flake check
