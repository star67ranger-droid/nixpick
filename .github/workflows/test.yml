name: test

on:
  push:
    branches: [master, main]
    tags: ["v[0-9]*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git identity for tests
        run: |
          git config --global user.email "nixpick-ci@localhost"
          git config --global user.name "nixpick-ci"
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=73

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - run: nix flake check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.*"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "mypy==1.18.*"
      - run: mypy --follow-imports=skip engine.py sync_runner.py config.py theme.py cli.py rofi_mode.py doctor.py nixpick.py flake_git.py fix_git_runner.py messages.py rebuild_runner.py flake_lock.py native_env.py i18n.py errors.py

  # Release « notes seules » (aucun artefact) : uniquement sur tag,
  # et seulement si tous les checks sont verts.
  release:
    needs: [pytest, flake, lint, typecheck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes depuis le CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            function is_header(line) {
              if (index(line, "## " ver) != 1) return 0
              rest = substr(line, length("## " ver) + 1)
              return rest == "" || substr(rest, 1, 1) == " "
            }
            is_header($0) { flag = 1; next }
            /^## / { flag = 0 }
            flag
          ' CHANGELOG.md > notes.md
          test -s notes.md || {
            echo "pas de section pour $ver dans CHANGELOG.md" >&2
            exit 1
          }
      - name: Créer la release GitHub
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
