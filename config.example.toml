# Copier vers ~/.config/nixpick/config.toml et adapter.
# Couleurs : voir docs/THEMES.md
# Les clés peuvent aussi vivre sous une table [nixpick] (même noms).

# Langue d'interface : fr (défaut) ou en. Changeable en direct (Ctrl+S).
# language = "fr"

packages_file = "/etc/nixos/modules/packages.nix"
packages_anchor = "environment.systemPackages"
# Tableau d'arguments : aucune interprétation shell n'est effectuée.
rebuild_command = ["sudo", "nixos-rebuild", "switch", "--flake", "/etc/nixos#nixos"]

# TUI : fond transparent (terminal ANSI, ex. Kitty background_opacity)
transparent_background = false

# ── Thème TUI (OpenTUI) ─────────────────────────────────────────────────────
# Neutres zinc + UN seul accent (bleu) ; vert / rouge / ambre = états seuls.
[colors]
background = "#17181c"
surface = "#101114"
surface_elevated = "#212328"
text = "#c8ccd2"
text_muted = "#838a94"
primary = "#7ba4e0"
accent = "#8ab7ea"
accent_alt = "#6f9ad6"
warning = "#d6b072"
success = "#8cb37f"
danger = "#d9757e"
detail_title = "#838a94"
list_highlight_bg = "#21242a"

# ── Thème Rofi (nixpick --rofi) ─────────────────────────────────────────────
[colors.rofi]
background = "#271d1b"
text = "#e8e4df"
border = "#53433f"
prompt = "#ffb59e"
entry_text = "#f1dfda"
selected_background = "#723521"
selected_text = "#ffdbd0"
comment = "#8b8478"
