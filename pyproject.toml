[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nixpick"
version = "0.4.0"
description = "Recherche nixpkgs et édition déclarative de environment.systemPackages (NixOS)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pikeo" }]
keywords = ["nixos", "nixpkgs", "tui", "rofi"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "opentui>=0.1.2",
  "yoga-python>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.16", "mypy>=1.18"]

[project.urls]
Homepage = "https://github.com/star67ranger-droid/nixpick"
Repository = "https://github.com/star67ranger-droid/nixpick"

[project.scripts]
nixpick = "nixpick:main"

[tool.setuptools]
py-modules = [
  "nixpick",
  "engine",
  "tui",
  "cli",
  "rofi_mode",
  "config",
  "messages",
  "doctor",
  "rebuild_runner",
  "sync_runner",
  "flake_git",
  "fix_git_runner",
  "flake_lock",
  "rofi_theme",
  "native_env",
  "theme",
]

[tool.setuptools.data-files]
"share/nixpick/rofi" = [
  "assets/rofi/nixpick.rasi",
  "assets/rofi/nixpick-query.rasi",
]
"share/nixpick" = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Baseline lint (TST-02) : sélection explicite, pas de familles larges
# (évite les faux positifs S607 « git »/« notify-send » non absolus, E501, …).
# E402 protège l'ordre d'imports de tui.py : native_env.ensure_opentui_libs()
# DOIT précéder `import opentui` (libstdc++ NixOS) — les `# noqa: E402` sont
# voulus et RUF100 les contrôle.
target-version = "py312"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", # pycodestyle critique
  "E402", # import hors tête de module
  "F", # pyflakes (inclut F401, F841)
  "I001", # tri des imports
  "UP035", "UP017", # pyupgrade : collections.abc, datetime.UTC (3.12+)
  "FURB162", # fromisoformat() gère « Z » depuis 3.11
  "DTZ005", # datetime.now() sans tz
  "RUF059", "RUF100", # déballage inutile / noqa inutile
  "ISC004", # concaténation implicite dans les collections
  "SIM102", # if imbriqués fusionnables
  "PLR1730", # min()/max() au lieu de if
  "PLW1510", # subprocess sans check= explicite
  "S110", # try/except/pass
  "BLE001", # except aveugle
]

[tool.mypy]
# Socle typage : engine.py + sync_runner.py (config/theme suivis en import).
# tui.py hors périmètre (API opentui non typée, Any structurel).
python_version = "3.12"

[tool.coverage.run]
# Utilisé uniquement en CI (job pytest) : le sandbox Nix n'a pas pytest-cov,
# donc pas de --cov dans addopts (sinon `nix flake check` casse).
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
