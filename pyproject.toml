[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nixpick"
version = "0.1.0"
description = "Recherche nixpkgs et édition déclarative de environment.systemPackages (NixOS)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pikeo" }]
keywords = ["nixos", "nixpkgs", "tui", "rofi"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/star67ranger-droid/nixpick"
Repository = "https://github.com/star67ranger-droid/nixpick"

[project.scripts]
nixpick = "nixpick:main"

[tool.setuptools]
py-modules = ["nixpick", "engine", "tui", "cli", "rofi_mode", "config", "messages", "doctor"]

[tool.setuptools.package-data]
"*" = ["assets/rofi/*.rasi", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
